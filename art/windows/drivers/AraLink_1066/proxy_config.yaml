---
# WARNING: DO NOT EDIT THE FILE
# 警告：请勿编辑文件

logger:
  sink_type: file
  file_sink_path: "C:\\Windows\\System32\\Kinara\\ara_proxy_stde.log"
  file_rotation: true
  file_rotate_on_size_gt: 1048576
  file_rotate_max_files_to_retain: 4
  default_log_level: "INFO"
proxy:
  transporter_type: "UV_TRANSPORTER"
  dm_firmware_path: C:\Windows\System32\Kinara
  interface_type: "NAMED_PIPE"
  device_interface: "pcie"
  interface_named_pipe: ["//./pipe/proxy_pipe"] 
  inf_timeout_us: 60000000

  memory_manager:
    mem_size: 8589934592 # memory size in bytes, default : 8589934592 (8GB)
    llm_reserved_size: 8053063680 # default : 8053063680(1024 * 1024 * 1024 * 7.5), in bytes (for windows only)

  dram:
    boardname: "willow"
    cfg_bin: C:\Windows\System32\Kinara\ddr_cfg_35.bin
    training_enable: true
    lpddr4x: 0
    lpddrpad4x: 0
    rank: 0
    memory_part: 1

  write_tse_debug_info: true
